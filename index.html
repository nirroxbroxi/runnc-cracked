<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>CRACKED NC</title>
<style>
  :root{
    --y:#ffd400; --r:#ff4b3e; --ink:#0c1226;
    --glass:rgba(14,22,48,.74); --glass2:rgba(20,30,64,.82); --line:rgba(255,255,255,.17);
    --ok:#3ecf6a; --info:#4d8dff;
  }
  *{box-sizing:border-box; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.3) transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#9fd0f2;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none;user-select:none}
  canvas{display:block;width:100%;height:100%}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ============ HUD ============ */
  #timer{position:fixed;top:12px;left:50%;transform:translateX(-50%);color:#fff;padding:4px 22px 5px 18px;border-radius:22px;
    background:linear-gradient(180deg,rgba(20,30,64,.8),rgba(10,16,36,.8));border:1px solid var(--line);text-align:center;line-height:1.05;
    text-shadow:0 2px 4px rgba(0,0,0,.5);pointer-events:auto;display:none;font-variant-numeric:tabular-nums;cursor:grab;touch-action:none;
    box-shadow:0 8px 24px rgba(0,0,0,.35);backdrop-filter:blur(6px);transition:color .2s,border-color .2s,box-shadow .25s;overflow:hidden}
  #tmSnow{position:absolute;inset:0;width:100%;height:100%;border-radius:inherit;pointer-events:none;opacity:.9}
  @media(max-width:620px){#duelBox{top:auto;bottom:82px;min-width:212px;padding:6px 10px 7px}}
  #tmMain,#tmBest{position:relative;z-index:1}
  #tmMain{display:block;font-size:34px;font-weight:900;letter-spacing:1px}
  #tmBest{display:block;font-size:12px;font-weight:800;letter-spacing:.4px;opacity:.8;margin-top:1px}
  #timer.rec{box-shadow:0 0 0 2px #ffd400,0 0 24px rgba(255,212,0,.55)}
  #timer.rec #tmBest{color:#ffd400;opacity:1}
  #duelBox{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:6;display:none;min-width:252px;
    padding:7px 13px 8px;border-radius:14px;background:rgba(10,17,36,.42);border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(7px);color:#fff;font-weight:900;font-size:11px;letter-spacing:1px;text-align:center;
    box-shadow:0 6px 18px rgba(0,0,0,.32)}
  #duelBox .dl{display:flex;align-items:center;gap:9px}
  #duelBox .who{font-size:10px;letter-spacing:1.5px}
  #duelBox .me{color:#ffd400;text-shadow:0 0 8px rgba(255,212,0,.5)}
  #duelBox .ai{color:#b388ff;text-shadow:0 0 8px rgba(179,136,255,.5)}
  #duelBar{position:relative;flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.16)}
  #duelBar i{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);transition:left .12s linear;z-index:1}
  #duelMe{left:0;background:#ffd400;box-shadow:0 0 9px #ffd400}
  #duelAI{left:0;background:#b388ff;box-shadow:0 0 9px #b388ff}
  #duelTxt{display:block;margin-top:4px;font-size:9.5px;letter-spacing:.8px;color:#cfe0ff;font-weight:800}
  #duelTxt b{color:#ffd400}
  #dist{position:fixed;top:12px;left:12px;color:#fff;font-size:17px;font-weight:800;padding:10px 14px 12px;border-radius:18px;
    background:var(--glass);border:1px solid var(--line);pointer-events:none;display:none;min-width:240px;
    box-shadow:0 10px 28px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
  #distTxt{display:flex;align-items:baseline;gap:10px}
  #distTxt .lv{background:var(--y);color:#2a1d00;font-weight:900;font-size:13px;letter-spacing:.6px;padding:3px 10px;border-radius:999px;box-shadow:0 2px 0 #b38700}
  #distTxt .m{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums}
  #distTxt .x{margin-left:auto;font-size:14px;font-weight:800;color:#ffd9a0}
  #lvbar,#speedbar{margin-top:8px;height:6px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
  #speedbar{height:4px;margin-top:5px}
  #lvfill{display:block;height:100%;width:0;background:linear-gradient(90deg,#6df0ff,#4d8dff)}
  #speedfill{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd400,#ff4b3e);transition:width .15s linear}
  #lives{margin-top:8px;font-size:20px;display:flex;align-items:center;gap:3px}
  #lives .h{color:#ff4b5c} #lives .h.x{color:#6b6f7a}
  #lives .st{margin-left:auto;color:var(--y);background:rgba(255,212,0,.16);border-radius:999px;padding:2px 12px;font-weight:900;font-size:15px}
  #xpbar{margin-top:8px;font-size:12px;font-weight:800;color:#ffe9a8;display:flex;align-items:center;gap:8px}
  .xpb{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
  .xpb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd400,#ff7a1a);transition:width .35s ease}
  #hudBtns{position:fixed;top:12px;right:12px;display:none;gap:8px;z-index:7}
  #hudBtns .btn{padding:9px 16px;border-radius:12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(6px);box-shadow:0 6px 18px rgba(0,0,0,.3)}
  #help{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;color:#fff;font-size:13px;opacity:.85;
    width:max-content;max-width:94vw;padding:5px 16px;border-radius:999px;background:rgba(10,16,36,.5);
    text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #fps{position:fixed;left:12px;bottom:12px;display:none;color:#eaf6ff;font:800 13px/1 "Consolas",monospace;letter-spacing:.4px;
    padding:7px 11px;border-radius:10px;background:rgba(8,14,30,.62);border:1px solid var(--line);pointer-events:none;z-index:9;font-variant-numeric:tabular-nums}
  #fps b{color:#6df0ff} #fps.warn b{color:#ffd400} #fps.bad b{color:#ff6b5c}
  #dmg{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
    background:radial-gradient(ellipse at 50% 55%,rgba(255,60,40,0) 38%,rgba(255,40,30,.55) 100%)}
  #dmg.on{opacity:1}
  #hitBadge{position:fixed;top:76px;left:50%;transform:translateX(-50%) scale(.8);opacity:0;pointer-events:none;
    padding:6px 16px;border-radius:999px;font-weight:900;font-size:14px;letter-spacing:.5px;color:#2a1400;
    background:linear-gradient(180deg,#ffd86a,#ff9a1a);box-shadow:0 6px 18px rgba(0,0,0,.35);transition:opacity .2s,transform .2s}
  #hitBadge.on{opacity:1;transform:translateX(-50%) scale(1)}
  #online{position:fixed;top:12px;right:12px;z-index:6;font-size:14px;font-weight:800;color:#fff;text-align:right}
  #online .pill{font:inherit;color:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--glass);backdrop-filter:blur(6px);cursor:pointer;display:inline-block}
  #online .olist{margin-top:6px;min-width:220px;max-width:300px;max-height:44vh;overflow-y:auto;border-radius:14px;background:var(--glass);border:1px solid var(--line);padding:6px 12px;text-align:left;font-weight:700}
  #online .olist div{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.1)}
  #online small{color:#b9cde8;font-weight:600}

  /* ============ Boutons ============ */
  .btn{font:inherit;font-weight:800;font-size:19px;padding:12px 26px;margin:5px;border:0;border-radius:16px;cursor:pointer;
    letter-spacing:.2px;transition:transform .1s,box-shadow .12s,filter .15s,background .18s}
  .primary{background:linear-gradient(180deg,#fff08a 0%,#ffd400 45%,#ffb800 100%);color:#2a1d00;
    box-shadow:0 5px 0 #b38700,0 10px 18px rgba(0,0,0,.3);font-size:22px;padding:14px 40px}
  .ghost{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));color:#fff;
    box-shadow:inset 0 0 0 1px var(--line),0 4px 10px rgba(0,0,0,.2)}
  .ghost:hover{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.12))}
  .mini{font-size:14px;padding:8px 14px;margin:0;background:rgba(12,18,38,.55);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
  .btn:active{transform:translateY(3px)}
  .primary:active{box-shadow:0 1px 0 #b38700}
  .btn:focus-visible,#diff button:focus-visible,.seg button:focus-visible,.card:focus-visible,.setSeg button:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .off{background:#8d8d8d!important;color:#fff!important;box-shadow:0 4px 0 #5f5f5f!important}
  a.btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none}
  .btn.discord{background:linear-gradient(180deg,#8b78ff,#5865f2);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 4px 0 #3b46c9,0 8px 16px rgba(0,0,0,.25)}
  .btn.discord:hover{background:linear-gradient(180deg,#9d8cff,#6873ff)}
  .btn.discord:active{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 1px 0 #3b46c9}
  #bPlay{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

  /* ============ Écrans ============ */
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,14,30,.6);
    backdrop-filter:blur(3px);color:#fff;animation:fade .3s ease;z-index:8}
  #overlay.left{justify-content:flex-start;align-items:flex-start;overflow-y:auto;padding:28px 0;background:linear-gradient(90deg,rgba(8,14,30,.85) 0%,rgba(8,14,30,.5) 48%,rgba(8,14,30,0) 85%);backdrop-filter:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
  #panel{text-align:center;padding:26px 34px 24px;max-width:560px;border-radius:28px;
    background:linear-gradient(160deg,rgba(26,40,84,.84),rgba(10,16,36,.88));border:1px solid var(--line);
    box-shadow:0 24px 70px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.3,.4,1);
    max-height:92vh;overflow-y:auto;overflow-x:hidden;backdrop-filter:blur(10px);transition:max-width .28s ease,padding .28s ease}
  #overlay.left #panel{text-align:left;background:none;border:0;box-shadow:none;margin-left:6vw;padding:0;max-height:none;overflow:visible;backdrop-filter:none}
  #panel.wide{max-width:720px}
  #logo{display:none;margin-bottom:8px}
  #logo .word{font-family:Impact,"Arial Black",sans-serif;font-style:italic;font-size:clamp(60px,10vw,110px);line-height:.95;
    display:inline-block;transform:skewX(-8deg);letter-spacing:1px;animation:bob 3.2s ease-in-out infinite}
  #logo .l1{color:var(--y);text-shadow:0 6px 0 #b35a00,0 12px 20px rgba(0,0,0,.4)}
  #logo .l2{color:var(--r);text-shadow:0 6px 0 #8c1d14,0 12px 20px rgba(0,0,0,.4);animation-delay:.35s}
  @keyframes bob{0%,100%{transform:skewX(-8deg) translateY(0)}50%{transform:skewX(-8deg) translateY(-7px)}}
  #tag{font-size:20px;font-weight:700;color:#cfe6ff;margin-top:8px;letter-spacing:.5px}
  #title{font-size:44px;font-weight:900;margin:0 0 8px;background:linear-gradient(180deg,#fff,#cfe6ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
  #badge{display:none;background:var(--y);color:#2a1d00;font-weight:900;padding:5px 16px;border-radius:20px;margin-bottom:10px;animation:pulse 1s ease-in-out infinite}
  #stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 12px}
  #overlay.left #stats{justify-content:flex-start;margin-top:14px}
  .chip{background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.07));border:1px solid var(--line);
    border-radius:16px;padding:10px 16px;min-width:88px;text-align:center}
  .chip b{display:block;font-size:24px;font-variant-numeric:tabular-nums;color:#fff}
  .chip small{color:#b9cde8;font-size:13px}
  #text{font-size:17px;margin:4px 0 14px;line-height:1.45;color:#e6f0ff;max-width:460px;white-space:pre-line;
    background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:10px 16px}
  #btns{display:flex;flex-direction:column;align-items:center}
  #overlay.left #btns{align-items:flex-start}
  .sec{display:flex;flex-wrap:wrap;justify-content:center}
  #overlay.left .sec{justify-content:flex-start}
  #keys{display:none;grid-template-columns:auto auto;gap:8px 14px;margin-top:20px;font-size:15px;color:#d6e4f7;align-items:center;justify-content:start}
  .key{display:inline-block;min-width:24px;text-align:center;padding:3px 8px;margin-right:4px;border-radius:7px;background:#f5f7fb;color:#1a2238;font-weight:800;box-shadow:0 3px 0 #98a2b8}
  #keys>div:nth-child(2n){display:none}
  #toast{position:fixed;top:22%;left:0;right:0;text-align:center;font-family:Impact,"Arial Black",sans-serif;font-style:italic;
    font-size:clamp(40px,8vw,84px);color:var(--y);text-shadow:0 5px 0 #b35a00,0 10px 20px rgba(0,0,0,.45);
    pointer-events:none;opacity:0;letter-spacing:2px;z-index:9}
  #toast.go{animation:toast 1.8s ease-out}
  @keyframes toast{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.1)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
  #diff{display:none;gap:8px;margin:0 0 12px;flex-wrap:wrap;justify-content:center}
  #overlay.left #diff{justify-content:flex-start}
  #diff button{font:inherit;font-weight:800;font-size:15px;padding:8px 16px;border:0;border-radius:20px;cursor:pointer;
    background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);transition:transform .1s,filter .15s}
  #diff button:hover,.seg button:hover{filter:brightness(1.18);transform:translateY(-1px)}
  #diff button.on{background:var(--y);color:#2a1d00;box-shadow:none}
  #diff button[data-i="0"].on{background:#5ed67a;color:#0d2a14}
  #diff button[data-i="1"].on{background:var(--y);color:#2a1d00}
  #diff button[data-i="2"].on{background:#ff9a3c;color:#2a1400}
  #diff button[data-i="3"].on{background:var(--r);color:#fff}
  .seg{display:none;gap:8px;margin:0 0 12px;flex-wrap:wrap;justify-content:center}
  #overlay.left .seg{justify-content:flex-start}
  #overlay.left #logo .word{font-size:clamp(46px,6.6vw,86px)}
  #overlay.left #tag{margin-top:4px;font-size:17px}
  #overlay.left #stats{margin:8px 0 10px}
  #overlay.left .chip{padding:8px 14px}
  #overlay.left .chip b{font-size:20px}
  #overlay.left #text{margin:2px 0 10px;font-size:15px;line-height:1.34;padding:8px 14px;max-width:420px}
  #overlay.left #diff,#overlay.left .seg{margin-bottom:9px}
  .seg button{font:inherit;font-weight:800;font-size:15px;padding:8px 16px;border:0;border-radius:20px;cursor:pointer;
    background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);transition:transform .1s,filter .15s}
  .seg button.on{background:#ff7a1a;color:#fff;box-shadow:none}
  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 45%,rgba(255,40,40,.6) 100%)}
  #flash.go{animation:flash .6s ease-out}
  @keyframes flash{0%{opacity:1}100%{opacity:0}}

  /* ============ Clavier flottant ============ */
  #fkb{position:fixed;left:18px;bottom:66px;z-index:7;display:none;touch-action:none;user-select:none;
    padding:0;background:none;border:0;box-shadow:none;backdrop-filter:none}
  #fkb.drag #fkbBar{box-shadow:0 0 0 2px rgba(255,212,0,.55),0 6px 16px rgba(0,0,0,.45)}
  #fkb.fkbPreview{z-index:9}
  #fkbBar{display:flex;align-items:center;gap:7px;height:24px;padding:2px 5px 2px 9px;margin:0 0 6px;width:max-content;cursor:grab;touch-action:none;
    border-radius:999px;background:rgba(10,16,36,.5);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);
    color:#cfe6ff;font-weight:900;font-size:10px;letter-spacing:1.6px}
  #fkbBar:active{cursor:grabbing}
  #fkbBar .dot{width:14px;height:14px;border-radius:5px;flex:none;background:
    radial-gradient(circle,rgba(255,255,255,.9) 1px,transparent 1.4px) 0 0/5px 5px,
    linear-gradient(180deg,#4d8dff,#2f5fc0);box-shadow:0 2px 4px rgba(0,0,0,.4)}
  #fkbBar .nm{flex:1;white-space:nowrap}
  .fkbMini{width:20px;height:20px;padding:0;border:0;border-radius:7px;cursor:pointer;font:800 12px/20px inherit;text-align:center;
    color:#dfeaff;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .fkbMini:hover{background:rgba(255,255,255,.22)}
  #fkbKeys{display:grid;grid-template-columns:repeat(3,calc(56px * var(--fks,1)));grid-template-rows:repeat(2,calc(52px * var(--fks,1)));
    gap:calc(7px * var(--fks,1))}
  .fk{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;border:0;cursor:pointer;
    border-radius:calc(13px * var(--fks,1));color:#fff;font:inherit;font-weight:900;line-height:1;touch-action:none;
    background:linear-gradient(180deg,rgba(36,54,100,.86),rgba(12,20,44,.9));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.38);
    backdrop-filter:blur(7px);transition:transform .06s,box-shadow .12s,filter .12s;overflow:hidden}
  .fk::after{content:'';position:absolute;inset:4px;border-radius:inherit;border:1px solid rgba(255,255,255,.08);pointer-events:none}
  .fk .kl{font-size:calc(21px * var(--fks,1));letter-spacing:.3px;text-shadow:0 2px 3px rgba(0,0,0,.45)}
  .fk .ka{font-size:calc(8.5px * var(--fks,1));letter-spacing:.7px;color:#cfe6ff;text-transform:uppercase;opacity:.85;font-weight:800}
  .fk:hover{filter:brightness(1.12)}
  .fk.down{transform:translateY(2px) scale(.97);background:linear-gradient(180deg,#ffd84a,#f2a800);color:#2a1d00;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 2px 6px rgba(0,0,0,.3)}
  .fk.down .ka{color:#4a3300;opacity:.9}
  .fk.dead{opacity:.35;filter:saturate(.3)}
  #fkbCfg{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(5,9,20,.72);backdrop-filter:blur(4px);padding:18px}
  #fkbCfg.on{display:flex}
  #fkbCard{width:min(560px,94vw);max-height:92vh;overflow-y:auto;border-radius:24px;padding:20px 22px 18px;color:#fff;
    background:linear-gradient(160deg,rgba(26,40,84,.96),rgba(9,14,32,.97));border:1px solid var(--line);box-shadow:0 26px 70px rgba(0,0,0,.6)}
  #fkbCard h3{margin:0 0 6px;font-size:24px;color:#fff}
  #fkbCard p{margin:0 0 12px;font-size:14px;line-height:1.5;color:#cfe0f6}
  #fkbRows{display:flex;flex-direction:column;gap:8px;margin:6px 0 12px}
  .fkr{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:8px 12px;flex-wrap:wrap}
  .fkr>span{min-width:104px;font-size:13px;font-weight:900;letter-spacing:.6px;color:#ffd9a0;text-transform:uppercase}
  .fkr input{width:64px;text-align:center;font:inherit;font-weight:900;font-size:18px;padding:6px 8px;border-radius:10px;border:0;background:#f7f9ff;color:#101a2e;text-transform:uppercase}
  .fkr select{flex:1;min-width:130px;font:inherit;font-size:14px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:#1a2444;color:#fff;cursor:pointer}
  #fkbNote{font-size:12.5px;color:#ffe9a8;margin:0 0 10px;line-height:1.45}

  /* ============ Boutique ============ */
  #shop{display:none;margin-bottom:12px;min-width:320px;background:rgba(10,17,36,.34);border:1px solid rgba(255,255,255,.13);
    border-radius:20px;padding:12px 12px 8px;backdrop-filter:blur(9px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
  #wallet{font-size:20px;font-weight:900;color:var(--y);margin-bottom:10px;display:inline-block;background:rgba(255,212,0,.14);
